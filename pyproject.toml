[project]
name = "blackjack-supervisor"
version = "0.1.0"
description = "Supervisor de mesa de blackjack entrenado con aprendizaje por refuerzo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=0.29", "cma>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# En Windows con Smart App Control, torch para Python 3.14 queda bloqueado: usar Python 3.12.
rl = [
    "torch>=2.9",
    "stable-baselines3>=2.7",
    "sb3-contrib>=2.7",
    "tensorboard>=2.18",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval = ["replay_template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: prueba estadística larga (omitir con -m 'not slow')"]
