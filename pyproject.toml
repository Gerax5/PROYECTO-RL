[project]
name = "blackjack-supervisor"
version = "0.1.0"
description = "Supervisor de mesa de blackjack entrenado con aprendizaje por refuerzo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=0.29", "cma>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: prueba estadística larga (omitir con -m 'not slow')"]
